name: avian-birthday-local
services:
  inference:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    ports: ["127.0.0.1:8081:8081"]
    environment:
      INFERENCE_TOKEN: ${INFERENCE_TOKEN:?Use scripts/birthday/start-local.ps1}
    cpus: 0.5
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8081/health',headers={'Authorization':'Bearer '+os.environ['INFERENCE_TOKEN']}),timeout=10)"]
      interval: 10s
      timeout: 15s
      start_period: 120s
      retries: 12
  renderer:
    build:
      context: .
      dockerfile: app/renderer/Dockerfile
    ports: ["127.0.0.1:8082:8082"]
    environment:
      PORT: 8082
      RENDERER_TOKEN: ${RENDERER_TOKEN:?Use scripts/birthday/start-local.ps1}
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health',{headers:{Authorization:'Bearer '+process.env.RENDERER_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12

